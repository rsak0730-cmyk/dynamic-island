name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Show repository files
        run: |
          pwd
          find . -maxdepth 4 -type f | sort

      - name: Find Gradle wrapper
        run: |
          GRADLEW=$(find . -name gradlew -type f -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found anywhere in the repository."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle wrapper: $GRADLEW"
          echo "Project directory: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Find generated APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
